<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Generator Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #94a3b8;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 860px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus { border-color: #7c3aed; }
    textarea::placeholder { color: #4b5563; }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .results {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 640px) { .results { grid-template-columns: 1fr; } }

    .result-box {
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 1rem;
    }

    .result-box h3 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #2d3348;
    }

    .result-box.claude h3 { color: #a78bfa; }
    .result-box.gpt h3 { color: #60a5fa; }

    .result-text {
      font-size: 0.9rem;
      line-height: 1.65;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
    }

    .copy-btn {
      margin-top: 0.75rem;
      width: auto;
      padding: 0.4rem 0.9rem;
      background: #2d3348;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 6px;
    }

    .copy-btn:hover { background: #3d4562; opacity: 1; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prompt Generator Agent</h1>
    <p>Paste raw text and get optimized prompts for Claude and GPT-5X</p>
  </header>

  <div class="card">
    <label for="raw-text">Raw Text Input</label>
    <textarea id="raw-text" placeholder="Paste your raw text or rough prompt idea here..."></textarea>
    <button id="generate-btn" onclick="generate()">Generate Optimized Prompts</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>

    <div class="results" id="results" style="display:none;">
      <div class="result-box claude">
        <h3>Claude Optimized Prompt</h3>
        <div class="result-text" id="claude-output"></div>
        <button class="copy-btn" onclick="copy('claude-output', this)">Copy</button>
      </div>
      <div class="result-box gpt">
        <h3>GPT-5X Optimized Prompt</h3>
        <div class="result-text" id="gpt-output"></div>
        <button class="copy-btn" onclick="copy('gpt-output', this)">Copy</button>
      </div>
    </div>
  </div>

  <script>
    async function generate() {
      const rawText = document.getElementById("raw-text").value.trim();
      if (!rawText) { alert("Please enter some text first."); return; }

      const btn = document.getElementById("generate-btn");
      const spinner = document.getElementById("spinner");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const claudeOut = document.getElementById("claude-output");
      const gptOut = document.getElementById("gpt-output");

      btn.disabled = true;
      spinner.style.display = "block";
      status.textContent = "Generating...";
      results.style.display = "none";
      claudeOut.textContent = "";
      gptOut.textContent = "";

      const formData = new FormData();
      formData.append("raw_text", rawText);

      try {
        const resp = await fetch("/generate", { method: "POST", body: formData });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const chunk = line.slice(6);
            if (chunk === "[DONE]") break;
            if (chunk.startsWith("ERROR:")) {
              status.textContent = chunk;
              break;
            }
            fullText += chunk.replace(/\\n/g, "\n");
            renderResults(fullText, claudeOut, gptOut);
          }
        }

        results.style.display = "grid";
        status.textContent = "Done.";
      } catch (e) {
        status.textContent = "Error: " + e.message;
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    }

    function renderResults(text, claudeEl, gptEl) {
      const claudeMatch = text.match(/CLAUDE OPTIMIZED PROMPT:\n([\s\S]*?)(?=GPT-5X OPTIMIZED PROMPT:|$)/);
      const gptMatch = text.match(/GPT-5X OPTIMIZED PROMPT:\n([\s\S]*)/);
      if (claudeMatch) claudeEl.textContent = claudeMatch[1].trim();
      if (gptMatch) gptEl.textContent = gptMatch[1].trim();
    }

    async function copy(id, btn) {
      const text = document.getElementById(id).textContent;
      await navigator.clipboard.writeText(text);
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = orig, 1500);
    }

    document.getElementById("raw-text").addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") generate();
    });
  </script>
</body>
</html>
